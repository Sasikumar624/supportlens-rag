[pytest]
testpaths =
    backend/tests
pythonpath =
    backend
addopts =
    -ra
    --strict-markers
    -p no:cacheprovider
markers =
    api: FastAPI endpoint and HTTP contract tests.
    unit: Fast unit tests that do not require external services.
    rag: Retrieval, generation, and evaluation pipeline tests.
    integration: Tests that may touch service boundaries or composed workflows.
